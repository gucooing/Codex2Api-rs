name: codex2api

services:
  codex2api:
    image: ${CODEX2API_IMAGE:-ghcr.io/gucooing/codex2api-rs:latest}
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${CODEX2API_OAUTH_HOST:-127.0.0.1}:${CODEX2API_OAUTH_PORT:-8080}:8080"
      - "${CODEX2API_ADMIN_HOST:-127.0.0.1}:${CODEX2API_ADMIN_PORT:-8081}:8081"
      - "${CODEX2API_USER_HOST:-127.0.0.1}:${CODEX2API_USER_PORT:-8082}:8082"
      - "${CODEX2API_API_HOST:-127.0.0.1}:${CODEX2API_API_PORT:-8083}:8083"
    environment:
      CODEX2API_OAUTH_BIND: 0.0.0.0:8080
      CODEX2API_ADMIN_BIND: 0.0.0.0:8081
      CODEX2API_USER_BIND: 0.0.0.0:8082
      CODEX2API_API_BIND: 0.0.0.0:8083
      CODEX2API_DATABASE_URL: ${CODEX2API_DATABASE_URL:?Set CODEX2API_DATABASE_URL to a PostgreSQL database}
      CODEX2API_DB_MAX_CONNECTIONS: ${CODEX2API_DB_MAX_CONNECTIONS:-32}
      CODEX2API_DB_MIN_CONNECTIONS: ${CODEX2API_DB_MIN_CONNECTIONS:-2}
      CODEX2API_DB_ACQUIRE_TIMEOUT_SECONDS: ${CODEX2API_DB_ACQUIRE_TIMEOUT_SECONDS:-10}
      CODEX2API_DB_IDLE_TIMEOUT_SECONDS: ${CODEX2API_DB_IDLE_TIMEOUT_SECONDS:-300}
      CODEX2API_DB_MAX_LIFETIME_SECONDS: ${CODEX2API_DB_MAX_LIFETIME_SECONDS:-1800}
      CODEX2API_PUBLIC_OAUTH_URL: ${CODEX2API_PUBLIC_OAUTH_URL:-http://127.0.0.1:8080}
      CODEX2API_PUBLIC_ADMIN_URL: ${CODEX2API_PUBLIC_ADMIN_URL:-http://127.0.0.1:8081}
      CODEX2API_PUBLIC_USER_URL: ${CODEX2API_PUBLIC_USER_URL:-http://127.0.0.1:8082}
      CODEX2API_PUBLIC_API_URL: ${CODEX2API_PUBLIC_API_URL:-http://127.0.0.1:8083}
      CODEX2API_REDIS_URL: ${CODEX2API_REDIS_URL:?Set CODEX2API_REDIS_URL to a reachable Redis server}
      CODEX2API_REDIS_PREFIX: ${CODEX2API_REDIS_PREFIX:-}
      CODEX2API_TRUSTED_PROXIES: ${CODEX2API_TRUSTED_PROXIES:-}
      CODEX2API_CLIENT_IP_HEADERS: ${CODEX2API_CLIENT_IP_HEADERS:-}
      RUST_LOG: ${RUST_LOG:-codex2api=info}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
