anyhow.workspace = true
url.workspace = true
axum.workspace = true
http-body-util = "0.1"
codex2api-admin.workspace = true
codex2api-oauth.workspace = true
codex2api-api.workspace = true
codex2api-suppliers.workspace = true
codex2api-storage.workspace = true
codex2api-upstream.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
codex2api-storage = { workspace = true, features = ["test-support"] }
sqlx.workspace = true
futures.workspace = true
tempfile = "3"
