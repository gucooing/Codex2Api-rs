name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tag commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Test frontend contracts
        working-directory: frontend
        run: npm test

      - name: Export frontend
        working-directory: frontend
        run: npm run build

      - name: Build release binary
        run: cargo build --locked --release --package codex2api --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts package
          cp "target/$TARGET/release/codex2api" package/codex2api
          tar -C package -czf "artifacts/codex2api-$RELEASE_TAG-$TARGET.tar.gz" codex2api

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force artifacts, package | Out-Null
          Copy-Item "target/$env:TARGET/release/codex2api.exe" package/codex2api.exe
          Compress-Archive -Path package/codex2api.exe -DestinationPath "artifacts/codex2api-$env:RELEASE_TAG-$env:TARGET.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum codex2api-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
