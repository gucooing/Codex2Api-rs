name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check provider module boundaries
        run: python3 scripts/check-provider-boundaries.py
      - name: Test account migration and database boundaries
        run: python3 scripts/test-account-migration.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-user/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend types and contracts
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
      - name: Build independent user frontend
        working-directory: frontend-user
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

      - name: Export embedded application
        working-directory: frontend
        run: npm run build
      - name: Test supplier administration in the browser
        working-directory: frontend
        env:
          CODEX2API_TEST_BASE_URL: http://127.0.0.1:8793
          CODEX2API_TEST_OUTPUT_DIR: ../target/supplier-admin-ui
        run: |
          npx playwright install --with-deps chromium
          node scripts/preview-export.mjs > /tmp/codex2api-ui-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8793/admin/suppliers/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test supplier-management.spec.ts plan-details.spec.ts public-urls.spec.ts
      - name: Upload supplier administration screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplier-administration-ui
          path: target/supplier-admin-ui
          if-no-files-found: ignore
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        env:
          CODEX2API_TEST_BROWSER_OUTPUT: ${{ github.workspace }}/target/desktop-browser/policy.json
        run: cargo test --workspace --locked --no-fail-fast
      - name: Upload Desktop browser protocol fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-browser-contract
          path: target/desktop-browser/policy.json
          if-no-files-found: ignore

  container:
    needs: check
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
