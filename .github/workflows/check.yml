name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: codex2api
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codex2api_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U codex2api -d codex2api_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CODEX2API_REDIS_URL: redis://127.0.0.1:6379/0
      CODEX2API_TEST_DATABASE_URL: postgresql://codex2api:test@127.0.0.1:5432/codex2api_test
      CODEX2API_DB_MIN_CONNECTIONS: 0
      CODEX2API_DB_MAX_CONNECTIONS: 4
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v7
      - name: Check provider module boundaries
        run: python3 scripts/check-provider-boundaries.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-user/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend types and critical logic
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
      - name: Build independent user frontend
        working-directory: frontend-user
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build

      - name: Export embedded application
        working-directory: frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        env:
          CODEX2API_TEST_BROWSER_OUTPUT: ${{ github.workspace }}/target/desktop-browser/policy.json
        run: cargo test --workspace --locked --no-fail-fast
      - name: Upload Desktop browser protocol fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-browser-contract
          path: target/desktop-browser/policy.json
          if-no-files-found: ignore

  container:
    needs: check
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
